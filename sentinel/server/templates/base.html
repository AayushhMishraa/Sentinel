<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if open_alerts_count and open_alerts_count > 0 %}({{ open_alerts_count }}) Alerts - {% elif stats and stats.total_open > 0 %}({{ stats.total_open }}) Alerts - {% endif %}{% block title %}Sentinel{% endblock %}</title>

<!-- Blocking Anti-Flicker Script: Synchronous theme resolution before any CSS render -->
<script>
(function() {
  try {
    var stored = localStorage.getItem('sentinel_theme');
    var theme = stored;
    if (!theme) {
      theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.className = theme;
  } catch(e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

<!-- Critical Preloads for Local Fonts -->
<link rel="preload" href="{{ url_for('static', filename='fonts/inter-latin-400.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ url_for('static', filename='fonts/inter-latin-600.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ url_for('static', filename='fonts/jetbrains-mono-latin-400.woff2') }}" as="font" type="font/woff2" crossorigin>

<!-- Critical Inline CSS: Prevents Flash of Unstyled Content (FOUC) and Sets Initial Canvas -->
<style>
  html {
    background-color: #0b0f14;
    color: #f1f5f9;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  html[data-theme="light"] {
    background-color: #f8fafc;
    color: #0f172a;
    color-scheme: light;
  }
  html[data-theme="contrast"] {
    background-color: #000000;
    color: #ffffff;
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: var(--surface-bg, #0b0f14);
    background-image: var(--ambient-bg, none);
    color: var(--text-primary, #f1f5f9);
    transition: background-color var(--dur-theme, 350ms) var(--ease-standard, ease),
                color var(--dur-theme, 350ms) var(--ease-standard, ease);
  }
</style>

<!-- Semantic Tokens & Design System -->
<link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<!-- Tailwind CSS v4 Browser Build (Vendored locally for 100% offline demo resilience) -->
<script src="{{ url_for('static', filename='vendor/tailwindcss-browser-4.3.5.js') }}"></script>
<style type="text/tailwindcss">
  @theme {
    --color-surface-bg: var(--surface-bg);
    --color-surface-card: var(--surface-card);
    --color-surface-raised: var(--surface-raised);
    --color-surface-hover: var(--surface-hover);
    --color-surface-selected: var(--surface-selected);
    --color-border-subtle: var(--border-subtle);
    --color-border-strong: var(--border-strong);
    --color-text-primary: var(--text-primary);
    --color-text-muted: var(--text-muted);
    --color-text-faint: var(--text-faint);
    --color-accent: var(--accent);
    --color-ok: var(--ok);
    --color-danger: var(--danger);
    --color-sev-critical: var(--sev-critical);
    --color-sev-high: var(--sev-high);
    --color-sev-medium: var(--sev-medium);
    --color-sev-low: var(--sev-low);
    --color-sev-info: var(--sev-info);
  }
</style>

<!-- Legacy Test Selectors & Required Layout Compatibility -->
<style>
main { max-width: 1400px; margin: 40px auto; padding: 0 24px; }
.card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg, 10px);
  box-shadow: var(--card-highlight);
  overflow-x: auto;
}
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.badge.critical { background: var(--sev-critical-soft); color: var(--sev-critical); border: 1px solid var(--sev-critical); }
.badge.high { background: var(--sev-high-soft); color: var(--sev-high); border: 1px solid var(--sev-high); }
.badge.medium { background: var(--sev-medium-soft); color: var(--sev-medium); border: 1px solid var(--sev-medium); }
.badge.low { background: var(--sev-low-soft); color: var(--sev-low); border: 1px solid var(--sev-low); }
.badge.info { background: var(--sev-info-soft); color: var(--sev-info); border: 1px solid var(--sev-info); }
.badge.status-open { background: var(--danger-soft); color: var(--danger); }
.badge.status-approved { background: var(--ok-soft); color: var(--ok); }
.badge.status-rejected { background: var(--sev-high-soft); color: var(--sev-high); }
.badge.status-acknowledged { background: var(--sev-high-soft); color: var(--sev-high); }
.badge.online { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
.badge.offline { background: var(--sev-info-soft); color: var(--text-faint); border: 1px solid var(--border-strong); }
.diff-container { background: #000; border: 1px solid var(--border-subtle); border-radius: 6px; padding: 12px; font-family: var(--font-mono); font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.diff-line-add { color: #00ff9f; background: rgba(0,255,159,0.05); }
.diff-line-del { color: #ff4444; background: rgba(255,68,68,0.05); }
.diff-line-hdr { color: #33b5e5; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-box { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg, 10px); padding: 14px; text-align: center; box-shadow: var(--card-highlight); }
.stat-val { display: inline-block; font-size: 26px; font-weight: 700; margin-top: 4px; transform-origin: center center; color: var(--text-primary); font-variant-numeric: tabular-nums; }

/* Restrained Highlight Animation for Test Compliance */
@keyframes bounce-anim {
  0% { transform: scale(1); }
  35% { transform: scale(1.6); color: var(--warn); }
  65% { transform: scale(1.6); color: var(--warn); }
  100% { transform: scale(1); }
}
.bounce-anim {
  animation: bounce-anim 1.5s ease-in-out;
  display: inline-block;
}

.legend-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; font-size: 12px; }
.legend-item { background: var(--surface-raised); border: 1px solid var(--border-subtle); border-radius: var(--radius-md, 6px); padding: 10px; }
.legend-item b { color: var(--text-primary); font-family: var(--font-mono); }

/* Sleek Dark Mode Toast Notifications */
#toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  background: var(--surface-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md, 6px);
  padding: 12px 18px;
  color: var(--text-primary);
  font-family: var(--font-sans);
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.25s ease, transform 0.25s ease;
  min-width: 280px;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}
.toast-critical { border-left: 4px solid var(--sev-critical); }
.toast-high { border-left: 4px solid var(--sev-high); }
.toast-medium { border-left: 4px solid var(--sev-medium); }
.toast-low { border-left: 4px solid var(--sev-low); }
.toast-info { border-left: 4px solid var(--sev-info); }
.toast-msg { font-size: 13px; font-weight: 500; color: var(--text-primary); }
.toast-close {
  background: none;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
  padding: 0 4px;
}
.toast-close:hover {
  color: var(--text-primary);
}

/* Theme Switcher Header Controls */
.theme-switcher {
  display: inline-flex;
  align-items: center;
  background: var(--surface-raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md, 6px);
  padding: 2px;
  gap: 2px;
}
.theme-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--dur-fast, 120ms) ease;
}
.theme-btn:hover {
  color: var(--text-primary);
}
.theme-btn.active {
  background: var(--surface-hover);
  color: var(--accent);
}
</style>
</head>
<body>
<header class="top" style="border-bottom: 1px solid var(--border-subtle); background: var(--surface-card); box-shadow: var(--card-highlight); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;">
  <div style="display: flex; align-items: center; gap: 32px;">
    <div class="brand" style="font-weight: 700; font-size: 16px; letter-spacing: 0.05em; color: var(--text-primary);">
      SENTINEL <span style="font-weight: 400; font-size: 12px; color: var(--text-muted); margin-left: 8px;">File Integrity Monitor</span>
    </div>
    <nav style="display: flex; gap: 16px;">
      <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}on{% endif %}" style="text-decoration: none; font-size: 13px; font-weight: 600; color: {% if request.endpoint == 'index' %}var(--accent){% else %}var(--text-muted){% endif %};">Alerts Feed</a>
      <a href="{{ url_for('assets_view') }}" class="{% if request.endpoint == 'assets_view' %}on{% endif %}" style="text-decoration: none; font-size: 13px; font-weight: 600; color: {% if request.endpoint == 'assets_view' %}var(--accent){% else %}var(--text-muted){% endif %};">Monitored Assets</a>
      <a href="{{ url_for('report_view') }}" target="_blank" style="text-decoration: none; font-size: 13px; font-weight: 600; color: var(--text-muted);">Compliance Report</a>
      <a href="{{ url_for('ui_kit_view') }}" class="{% if request.endpoint == 'ui_kit_view' %}on{% endif %}" style="text-decoration: none; font-size: 13px; font-weight: 600; color: {% if request.endpoint == 'ui_kit_view' %}var(--accent){% else %}var(--text-muted){% endif %};">UI Kit</a>
    </nav>
  </div>

  <div class="theme-switcher">
    <button type="button" class="theme-btn" onclick="setSentinelTheme('dark')" id="theme-btn-dark">Dark</button>
    <button type="button" class="theme-btn" onclick="setSentinelTheme('light')" id="theme-btn-light">Light</button>
    <button type="button" class="theme-btn" onclick="setSentinelTheme('contrast')" id="theme-btn-contrast">Contrast</button>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<div id="toast-container"></div>

<script>
function setSentinelTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.className = theme;
  try {
    localStorage.setItem('sentinel_theme', theme);
  } catch(e) {}
  updateThemeSwitcherUI();
}

function updateThemeSwitcherUI() {
  var current = document.documentElement.getAttribute('data-theme') || 'dark';
  ['dark', 'light', 'contrast'].forEach(function(t) {
    var btn = document.getElementById('theme-btn-' + t);
    if (btn) {
      if (t === current) btn.classList.add('active');
      else btn.classList.remove('active');
    }
  });
}
document.addEventListener('DOMContentLoaded', updateThemeSwitcherUI);
</script>

{% block scripts %}{% endblock %}
</body>
</html>
